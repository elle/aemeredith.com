- quote: "Elle’s coaching has helped me to work through challenges comprehensively and with confidence. This coaching approach helps me go back to first principles, challenge my assumptions and ensure I’ve considered situations from multiple perspectives. Elle also knows when to use her own experience to step into ‘advice mode’ and does so sparingly and with explicit permission. A coaching partnership with Elle is an easy recommendation to make."
  author: "Stu Liston, Engineering Operations Lead"
- quote: "In the demanding realm of management, the higher you climb, the fewer sources of support you encounter, leading to a profound sense of isolation. With Blackmill, the experience is remarkably different — Elle provides a trusted and safe environment where I can openly discuss challenges and explore ideas. Her background in engineering leadership enables her to offer nuanced, industry-specific insights that are both practical and transformative."
  author: "Vanessa Sant’Anna, VP of Engineering"
- quote: "I find my ongoing coaching sessions with Elle to be the most beneficial engagement with Blackmill. Elle draws on her years of experience to offer appropriate guidance when facing difficult situations like rapid growth, interpersonal conflicts and dysfunctional team culture. Beyond the practicalities of ‘how to be effective in the workplace’, Elle demonstrates genuine compassion and care for me as a person."
  author: "Lily, Head of Customer Experience"
- quote: "Elle brings clarity, honestly, and empathy to our discussions about engineering management challenges. I’ve been fortunate to benefit from her experience and judgement on a variety of issues including strategic thinking, capacity planning, and conflict resolution. As our team and mission grow I’m often encountering new challenges and Elle’s counsel has helped me navigate these situations with greater confidence."
  author: "Geoff Harcourt, CTO, CommonLit"
