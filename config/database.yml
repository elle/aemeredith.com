default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("DB_POOL") { Integer(ENV.fetch("WEB_MAX_THREADS", 5)) + Integer(ENV.fetch("QUE_WORKER_COUNT", 1)) + 2 } %>

development:
  <<: *default
  database: aemeredith_development

test:
  <<: *default
  database: aemeredith_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
